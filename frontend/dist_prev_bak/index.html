<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>效能评估系统</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M8 22V13M14 22V9M20 22V16M26 22V11' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-Dl_reIrf.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-CwYx_2nS.js">
    <link rel="modulepreload" crossorigin href="./assets/element-DwNaqPli.js">
    <link rel="stylesheet" crossorigin href="./assets/index-B9N-7JNS.css">
  </head>
  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <p>效能评估系统正在加载…</p>
      </div>
    </div>
    <style>
      .boot-loading {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        color: #5b6b86; background: #f4f7fb;
      }
      .boot-spinner {
        width: 38px; height: 38px; border: 3px solid #d6e2f5; border-top-color: #1f6feb;
        border-radius: 50%; animation: boot-spin 0.9s linear infinite; margin-bottom: 14px;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // 入口脚本加载失败时的兜底提示。
      // 正常情况下 Vue 挂载完成后会替换掉 #app 里的占位内容；若 12 秒后占位内容还在，
      // 说明入口资源没能加载成功（例如系统更新后浏览器仍在引用已被替换掉的旧文件），
      // 此时给出明确、可操作的提示，而不是让使用者对着一直转圈的页面无从下手。
      setTimeout(function () {
        var box = document.querySelector('#app .boot-loading')
        if (!box) return
        var spinner = box.querySelector('.boot-spinner')
        if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner)
        box.innerHTML =
          '<p style="margin:0 0 8px;font-weight:600;color:#303133">页面加载失败</p>' +
          '<p style="margin:0 0 16px;font-size:13px;color:#909399">' +
          '可能是系统已更新，或浏览器缓存了旧文件。请点击下面的按钮重新加载。' +
          '</p>' +
          '<button id="boot-retry" style="padding:8px 22px;border:0;border-radius:4px;' +
          'background:#1f6feb;color:#fff;font-size:14px;cursor:pointer">重新加载</button>'
        var btn = document.getElementById('boot-retry')
        if (btn) btn.onclick = function () { window.location.reload() }
      }, 12000)
    </script>
  </body>
</html>
